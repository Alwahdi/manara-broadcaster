name: Platform Admin

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Command to run: apply-schema, list, approve, suspend, expire, policy"
        required: true
        default: "list"
      args:
        description: "Extra arguments, for example: pending OR <id> --plan=pro --days=365 --features=all"
        required: false
        default: "all"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  platform:
    name: Run platform admin command
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron-broadcaster

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron-broadcaster/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run platform admin
        env:
          MANARA_NEON_DATABASE_URL: ${{ secrets.MANARA_NEON_DATABASE_URL }}
          HYDRA_IPTV_HOST: ${{ secrets.HYDRA_IPTV_HOST }}
          HYDRA_IPTV_USERNAME: ${{ secrets.HYDRA_IPTV_USERNAME }}
          HYDRA_IPTV_PASSWORD: ${{ secrets.HYDRA_IPTV_PASSWORD }}
          PLATFORM_COMMAND: ${{ inputs.command }}
          PLATFORM_ARGS: ${{ inputs.args }}
        run: |
          node - <<'NODE'
          const { spawnSync } = require('node:child_process');
          const args = [process.env.PLATFORM_COMMAND || 'list'];
          const extra = String(process.env.PLATFORM_ARGS || '').trim();
          if (extra) args.push(...extra.match(/(?:[^\s"]+|"[^"]*")+/g).map((v) => v.replace(/^"|"$/g, '')));
          const result = spawnSync(process.execPath, ['scripts/platform-admin.cjs', ...args], { stdio: 'inherit', shell: false });
          process.exit(result.status || 0);
          NODE
