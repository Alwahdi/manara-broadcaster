name: Release Windows App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and publish Windows release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron-broadcaster

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron-broadcaster/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Write owner cloud config
        shell: pwsh
        env:
          MANARA_NEON_DATABASE_URL: ${{ secrets.MANARA_NEON_DATABASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          $neon = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($env:MANARA_NEON_DATABASE_URL ?? ""))
          $sentry = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($env:SENTRY_DSN ?? ""))
          "module.exports = { neonDatabaseUrl: Buffer.from('$neon', 'base64').toString('utf8'), sentryDsn: Buffer.from('$sentry', 'base64').toString('utf8') };" | Set-Content -Path "library/cloud-runtime.cjs" -Encoding UTF8

      - name: Publish release artifacts
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
