<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>WIVA Channel Broadcaster</title>
</head>
<body>
<video id="preview" autoplay muted playsinline style="width:1px;height:1px;opacity:0"></video>
<script>
const log = (...args) => console.log('[WIVA broadcaster]', ...args);
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

function readConfig() {
  const encoded = new URLSearchParams(location.search).get('config') || '';
  try {
    return JSON.parse(atob(encoded.replace(/-/g, '+').replace(/_/g, '/')));
  } catch (error) {
    throw new Error('Invalid broadcaster config: ' + error.message);
  }
}

const config = readConfig();
const peers = new Map();
const peerCloseTimers = new Map();
let ws = null;
let stream = null;
let captureSourceStream = null;
let audioContext = null;
let reconnectTimer = null;
let audioMuteTimer = null;
let healthTimer = null;
let restarting = false;
const AUDIO_MUTE_RESTART_MS = 4500;
const HEALTH_CHECK_MS = 2500;

function positiveNumber(value, fallback, min, max) {
  const next = Number(value);
  if (!Number.isFinite(next) || next <= 0) return fallback;
  return Math.max(min, Math.min(max, Math.round(next)));
}

function positiveFloat(value, fallback, min, max) {
  const next = Number(value);
  if (!Number.isFinite(next) || next <= 0) return fallback;
  return Math.max(min, Math.min(max, next));
}

function audioProfile() {
  const mode = ['direct', 'voice', 'cinema'].includes(String(config.audioMode || '').trim())
    ? String(config.audioMode).trim()
    : 'direct';
  return {
    mode,
    gain: positiveFloat(config.audioGain, 1, 0.5, 2),
  };
}

function targetQuality() {
  return {
    width: positiveNumber(config.width, 1920, 320, 3840),
    height: positiveNumber(config.height, 1080, 240, 2160),
    fps: positiveNumber(config.fps, 30, 15, 60),
    bitrateKbps: positiveNumber(config.bitrateKbps, 8000, 800, 25000),
    audioBitrateKbps: positiveNumber(config.audioBitrateKbps, 256, 64, 320),
  };
}

function directAudioConstraints(audioDevice) {
  const constraints = {
    sampleRate: { ideal: 48000 },
    channelCount: { ideal: 2 },
    echoCancellation: false,
    noiseSuppression: false,
    autoGainControl: false,
  };
  if (audioDevice) constraints.deviceId = { exact: audioDevice.deviceId };
  return constraints;
}

function relaxedAudioConstraints(audio) {
  if (!audio || audio === true) return audio;
  return {
    ...(audio.deviceId ? { deviceId: audio.deviceId } : {}),
    echoCancellation: false,
    noiseSuppression: false,
    autoGainControl: false,
  };
}

function trackSummary(track) {
  let settings = {};
  try { settings = track.getSettings ? track.getSettings() : {}; } catch {}
  if (track.kind === 'video') {
    return `video:${track.label || 'source'} ${settings.width || '?'}x${settings.height || '?'} ${settings.frameRate || '?'}fps`;
  }
  return `audio:${track.label || 'source'} ${settings.sampleRate || '?'}Hz ${settings.channelCount || '?'}ch`;
}

function stopCurrentStream() {
  if (audioMuteTimer) clearTimeout(audioMuteTimer);
  audioMuteTimer = null;
  try { stream?.getTracks?.().forEach((track) => track.stop()); } catch {}
  if (captureSourceStream && captureSourceStream !== stream) {
    try { captureSourceStream.getTracks().forEach((track) => track.stop()); } catch {}
  }
  try { audioContext?.close?.(); } catch {}
  stream = null;
  captureSourceStream = null;
  audioContext = null;
}

function needsConfiguredAudio() {
  return !!String(config.audioDeviceId || '').trim() && String(config.audioDeviceId || '').trim() !== 'none';
}

function audioTracksHealthy(mediaStream) {
  if (!needsConfiguredAudio()) return true;
  const audioTracks = mediaStream?.getAudioTracks?.() || [];
  return audioTracks.some((track) => track.readyState === 'live' && track.enabled !== false && !track.muted);
}

function restartCapture(reason) {
  if (restarting) return;
  restarting = true;
  log('restarting capture:', reason);
  for (const id of Array.from(peers.keys())) closePeer(id);
  stopCurrentStream();
  try { ws && ws.close(); } catch {}
  setTimeout(() => { restarting = false; restartSoon(); }, 200);
}

function scheduleAudioRestart(reason) {
  if (!needsConfiguredAudio() || audioMuteTimer || restarting) return;
  audioMuteTimer = setTimeout(() => {
    audioMuteTimer = null;
    restartCapture(reason);
  }, AUDIO_MUTE_RESTART_MS);
}

function clearAudioRestart() {
  if (audioMuteTimer) clearTimeout(audioMuteTimer);
  audioMuteTimer = null;
}

function watchTrackHealth(track, label = '') {
  track.onended = () => restartCapture(`${track.kind} track ended ${label}`.trim());
  if (track.kind === 'audio') {
    track.onmute = () => scheduleAudioRestart(`audio track muted ${label}`.trim());
    track.onunmute = () => clearAudioRestart();
  }
}

function startHealthWatch() {
  if (healthTimer) return;
  healthTimer = setInterval(() => {
    if (restarting) return;
    if (audioContext?.state === 'suspended') {
      audioContext.resume().catch(() => {});
    }
    if (needsConfiguredAudio() && stream && !audioTracksHealthy(stream)) {
      scheduleAudioRestart('audio output is not healthy');
    }
    if (needsConfiguredAudio() && captureSourceStream && !audioTracksHealthy(captureSourceStream)) {
      scheduleAudioRestart('audio source is not healthy');
    }
  }, HEALTH_CHECK_MS);
}

function norm(value) {
  return String(value || '').toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]+/g, ' ').trim();
}

function findDevice(devices, kind, wantedId, wantedName) {
  const rows = devices.filter((device) => device.kind === kind);
  const id = norm(wantedId);
  const name = norm(wantedName);
  const direct = rows.find((device) => device.deviceId === wantedId);
  if (direct) return direct;
  const byIdLabel = rows.find((device) => id && norm(device.label).includes(id));
  if (byIdLabel) return byIdLabel;
  const nameTokens = name.split(' ').filter((part) => part.length >= 3);
  const scored = rows
    .map((device) => {
      const label = norm(device.label);
      let score = 0;
      if (name && label === name) score += 100;
      if (name && label.includes(name)) score += 80;
      if (name && name.includes(label)) score += 60;
      if (id && label.includes(id)) score += 40;
      for (const token of nameTokens) if (label.includes(token)) score += 8;
      return { device, score };
    })
    .filter((row) => row.score > 0)
    .sort((a, b) => b.score - a.score);
  const byName = scored[0]?.device;
  if (byName) return byName;
  if (wantedId || wantedName) return null;
  return rows[0] || null;
}

async function captureStream() {
  const source = config.source || {};
  const sourceType = String(source.type || 'screen');
  const audioId = String(config.audioDeviceId || '').trim();
  const quality = targetQuality();
  let devices = [];
  try { devices = await navigator.mediaDevices.enumerateDevices(); } catch {}

  let audio = false;
  if (audioId && audioId !== 'none') {
    const audioDevice = findDevice(devices, 'audioinput', audioId, config.audioDeviceMatchName || config.audioDeviceName || audioId);
    if (!audioDevice && (audioId || config.audioDeviceName)) {
      throw new Error('Selected audio capture device is not available: ' + (config.audioDeviceName || audioId));
    }
    audio = directAudioConstraints(audioDevice);
  }

  if (sourceType === 'device') {
    const videoDevice = findDevice(devices, 'videoinput', source.id, source.matchName || source.name || config.name);
    if (!videoDevice && (source.id || source.name || source.matchName)) {
      throw new Error('Selected video capture device is not available: ' + (source.name || source.id));
    }
    const baseVideo = videoDevice ? { deviceId: { exact: videoDevice.deviceId } } : {};
    const strictVideo = {
      ...baseVideo,
      width: { min: Math.min(1280, quality.width), ideal: quality.width, max: quality.width },
      height: { min: Math.min(720, quality.height), ideal: quality.height, max: quality.height },
      frameRate: { ideal: quality.fps, max: quality.fps },
      aspectRatio: { ideal: quality.width / quality.height },
    };
    const relaxedVideo = {
      ...baseVideo,
      width: { ideal: quality.width },
      height: { ideal: quality.height },
      frameRate: { ideal: quality.fps, max: quality.fps },
      aspectRatio: { ideal: quality.width / quality.height },
    };
    try {
      return await navigator.mediaDevices.getUserMedia({ video: strictVideo, audio });
    } catch (error) {
      log('strict capture constraints failed, retrying relaxed constraints:', error.message);
      try {
        return await navigator.mediaDevices.getUserMedia({ video: relaxedVideo, audio });
      } catch (secondError) {
        if (!audio || audio === true) throw secondError;
        log('capture audio constraints failed, retrying same audio device with simple constraints:', secondError.message);
        return navigator.mediaDevices.getUserMedia({ video: relaxedVideo, audio: relaxedAudioConstraints(audio) });
      }
    }
  }

  const sourceId = String(source.id || '').trim();
  const desktopVideo = {
    mandatory: {
      chromeMediaSource: 'desktop',
      chromeMediaSourceId: sourceId,
      minWidth: Math.min(1280, quality.width),
      minHeight: Math.min(720, quality.height),
      maxWidth: quality.width,
      maxHeight: quality.height,
      maxFrameRate: quality.fps,
    },
  };
  try {
    try {
      return await navigator.mediaDevices.getUserMedia({ video: desktopVideo, audio });
    } catch (error) {
      if (!audio || audio === true) throw error;
      log('desktop audio constraints failed, retrying same audio device with simple constraints:', error.message);
      return await navigator.mediaDevices.getUserMedia({ video: desktopVideo, audio: relaxedAudioConstraints(audio) });
    }
  } catch (error) {
    log('desktop getUserMedia failed, trying getDisplayMedia:', error.message);
    if (navigator.mediaDevices.getDisplayMedia) {
      return navigator.mediaDevices.getDisplayMedia({
        video: {
          width: { ideal: quality.width },
          height: { ideal: quality.height },
          frameRate: { ideal: quality.fps, max: quality.fps },
        },
        audio: !!audio,
      });
    }
    throw error;
  }
}

async function prepareAudio(rawStream) {
  const audioTracks = rawStream?.getAudioTracks?.() || [];
  if (!audioTracks.length) return rawStream;
  const profile = audioProfile();
  // HDMI audio is already a clean digital signal. Keep the historical
  // "cinema" default as passthrough too, so existing channels stop being
  // needlessly filtered after upgrading.
  if ((profile.mode === 'direct' || profile.mode === 'cinema') && profile.gain <= 1.05) return rawStream;
  try {
    audioContext = new AudioContext({ sampleRate: 48000 });
    if (audioContext.state === 'suspended') {
      try { await audioContext.resume(); } catch {}
    }
    audioContext.onstatechange = () => {
      if (audioContext?.state === 'suspended') {
        audioContext.resume().catch(() => scheduleAudioRestart('audio engine suspended'));
      }
    };
    const sourceNode = audioContext.createMediaStreamSource(rawStream);
    const destination = audioContext.createMediaStreamDestination();
    let tail = sourceNode;
    const chain = (node) => {
      tail.connect(node);
      tail = node;
      return node;
    };

    if (profile.mode === 'voice' || profile.mode === 'cinema') {
      const highpass = audioContext.createBiquadFilter();
      highpass.type = 'highpass';
      highpass.frequency.value = profile.mode === 'voice' ? 95 : 65;
      highpass.Q.value = 0.7;
      chain(highpass);

      const compressor = audioContext.createDynamicsCompressor();
      compressor.threshold.value = profile.mode === 'voice' ? -24 : -18;
      compressor.knee.value = profile.mode === 'voice' ? 18 : 24;
      compressor.ratio.value = profile.mode === 'voice' ? 3.2 : 2.2;
      compressor.attack.value = 0.004;
      compressor.release.value = profile.mode === 'voice' ? 0.28 : 0.22;
      chain(compressor);
    }

    const gain = audioContext.createGain();
    gain.gain.value = profile.gain;
    chain(gain);
    tail.connect(destination);
    const output = new MediaStream([
      ...rawStream.getVideoTracks(),
      ...destination.stream.getAudioTracks(),
    ]);
    log('audio profile enabled:', profile.mode, `${profile.gain.toFixed(2)}x`);
    return output;
  } catch (error) {
    log('audio profile skipped, using direct capture audio:', error.message);
    try { audioContext?.close?.(); } catch {}
    audioContext = null;
    return rawStream;
  }
}

async function ensureStream() {
  const needsAudio = needsConfiguredAudio();
  const hasLiveVideo = stream?.getVideoTracks?.().some((track) => track.readyState === 'live');
  const hasLiveAudio = !needsAudio || audioTracksHealthy(stream);
  if (stream && hasLiveVideo && hasLiveAudio) return stream;
  stopCurrentStream();
  captureSourceStream = await captureStream();
  for (const track of captureSourceStream.getTracks()) watchTrackHealth(track, 'source');
  stream = await prepareAudio(captureSourceStream);
  const preview = document.getElementById('preview');
  preview.srcObject = stream;
  try { await preview.play(); } catch {}
  for (const track of stream.getTracks()) {
    try {
      if (track.kind === 'video') track.contentHint = 'motion';
      if (track.kind === 'audio') track.contentHint = audioProfile().mode === 'voice' ? 'speech' : 'music';
    } catch {}
    watchTrackHealth(track, 'output');
  }
  clearAudioRestart();
  startHealthWatch();
  log('capture ready for', config.channelId, stream.getTracks().map(trackSummary).join(', '));
  return stream;
}

async function tuneSender(sender, track) {
  if (!sender || !track || typeof sender.getParameters !== 'function' || typeof sender.setParameters !== 'function') return;
  const quality = targetQuality();
  const params = sender.getParameters() || {};
  params.encodings = Array.isArray(params.encodings) && params.encodings.length ? params.encodings : [{}];
  if (track.kind === 'video') {
    params.degradationPreference = 'maintain-resolution';
    params.encodings[0] = {
      ...params.encodings[0],
      maxBitrate: quality.bitrateKbps * 1000,
      maxFramerate: quality.fps,
      scaleResolutionDownBy: 1,
    };
  } else if (track.kind === 'audio') {
    params.encodings[0] = {
      ...params.encodings[0],
      maxBitrate: quality.audioBitrateKbps * 1000,
    };
  }
  try { await sender.setParameters(params); } catch (error) { log('sender tuning skipped:', track.kind, error.message); }
}

function closePeer(id) {
  const key = String(id);
  const closeTimer = peerCloseTimers.get(key);
  if (closeTimer) clearTimeout(closeTimer);
  peerCloseTimers.delete(key);
  const pc = peers.get(key);
  if (pc) {
    try { pc.close(); } catch {}
    peers.delete(key);
  }
}

function clearPeerClose(id) {
  const key = String(id);
  const timer = peerCloseTimers.get(key);
  if (timer) clearTimeout(timer);
  peerCloseTimers.delete(key);
}

function closeDisconnectedPeerSoon(id, pc) {
  const key = String(id);
  if (peerCloseTimers.has(key)) return;
  const timer = setTimeout(() => {
    peerCloseTimers.delete(key);
    if (peers.get(key) === pc && pc.connectionState === 'disconnected') closePeer(key);
  }, 8000);
  peerCloseTimers.set(key, timer);
}

async function offerToViewer(viewerId) {
  const id = String(viewerId || '');
  if (!id || !ws || ws.readyState !== WebSocket.OPEN) return;
  closePeer(id);
  const localStream = await ensureStream();
  const pc = new RTCPeerConnection({ iceServers: [] });
  peers.set(id, pc);
  for (const track of localStream.getTracks()) {
    const sender = pc.addTrack(track, localStream);
    await tuneSender(sender, track);
  }
  pc.onicecandidate = (event) => {
    if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'ice', to: id, candidate: event.candidate }));
    }
  };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') clearPeerClose(id);
    else if (pc.connectionState === 'disconnected') closeDisconnectedPeerSoon(id, pc);
    else if (['failed', 'closed'].includes(pc.connectionState)) closePeer(id);
  };
  const offer = await pc.createOffer({ offerToReceiveAudio: false, offerToReceiveVideo: false });
  await pc.setLocalDescription(offer);
  ws.send(JSON.stringify({ type: 'offer', to: id, sdp: offer.sdp }));
}

function restartSoon() {
  if (reconnectTimer) return;
  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    connect().catch((error) => {
      log('reconnect failed:', error.message);
      restartSoon();
    });
  }, 2500);
}

async function connect() {
  await ensureStream();
  if (ws && ws.readyState === WebSocket.OPEN) return;
  ws = new WebSocket(config.wsUrl);
  ws.onopen = () => {
    log('registering', config.channelId, 'to', config.wsUrl);
    ws.send(JSON.stringify({
      type: 'register-broadcaster',
      channelId: String(config.channelId),
      name: config.name || String(config.channelId),
      description: config.description || '',
    }));
  };
  ws.onmessage = async (event) => {
    let msg = null;
    try { msg = JSON.parse(String(event.data)); } catch { return; }
    if (msg.type === 'broadcaster-ready') {
      for (const viewerId of msg.viewers || []) offerToViewer(viewerId).catch((error) => log('offer failed:', error.message));
      return;
    }
    if (msg.type === 'viewer-joined') {
      offerToViewer(msg.id).catch((error) => log('offer failed:', error.message));
      return;
    }
    if (msg.type === 'viewer-left') {
      closePeer(msg.id);
      return;
    }
    if (msg.type === 'answer' && msg.from) {
      const pc = peers.get(String(msg.from));
      if (pc) {
        try { await pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp }); } catch (error) { log('answer failed:', error.message); }
      }
      return;
    }
    if (msg.type === 'ice' && msg.from) {
      const pc = peers.get(String(msg.from));
      if (pc && msg.candidate) {
        try { await pc.addIceCandidate(msg.candidate); } catch {}
      }
    }
  };
  ws.onclose = () => {
    log('socket closed');
    for (const id of Array.from(peers.keys())) closePeer(id);
    restartSoon();
  };
  ws.onerror = () => {
    try { ws.close(); } catch {}
  };
}

(async () => {
  for (;;) {
    try {
      await connect();
      break;
    } catch (error) {
      log('startup failed:', error.message);
      await sleep(3000);
    }
  }
})();
</script>
</body>
</html>
