<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>IPTV</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:"Cairo",system-ui,-apple-system,"Segoe UI",sans-serif;background:#070b1e;color:#eef2ff}
  body{display:grid;place-items:center;padding:18px;background:linear-gradient(180deg,#081126 0%,#070b1e 52%,#050816 100%)}
  main{width:min(1080px,100%);border:1px solid rgba(148,163,184,.22);background:rgba(15,23,42,.72);border-radius:8px;overflow:hidden;box-shadow:0 22px 70px rgba(0,0,0,.36)}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
  .head-title{min-width:0}
  h1{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font-size:12px;color:#94a3b8;margin-top:3px}
  a,.back{color:#dbeafe;text-decoration:none;font-size:13px;border:1px solid rgba(148,163,184,.24);background:rgba(255,255,255,.08);border-radius:8px;padding:8px 12px;font-weight:800}
  video{display:block;width:100%;max-height:72vh;background:#000}
  .quality-bar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid rgba(148,163,184,.16);background:rgba(255,255,255,.025)}
  .quality-bar button{border:1px solid rgba(148,163,184,.24);background:rgba(255,255,255,.08);color:#e5e7eb;border-radius:8px;padding:8px 12px;font-weight:900;cursor:pointer}
  .quality-bar button.active{background:#2563eb;border-color:#60a5fa;color:#fff}
  .info{padding:14px 16px;font-size:13px;line-height:1.7;color:#cbd5e1}
  .error{margin-top:8px;padding:12px;border:1px solid rgba(248,113,113,.4);background:rgba(127,29,29,.22);border-radius:8px;color:#fecaca;display:none;text-align:right}
  .hint{padding:11px 12px;border:1px solid rgba(20,184,166,.28);background:rgba(20,184,166,.1);border-radius:8px;color:#ccfbf1}
  .watch-overlay{position:fixed;inset:0;background:rgba(3,7,18,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
  .watch-card{max-width:420px;width:100%;background:#101936;border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:18px;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.35)}
  .watch-card h2{font-size:20px;margin-bottom:8px}
  .watch-card p{color:#cbd5e1;line-height:1.7;margin-bottom:14px}
  .watch-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .watch-actions button{border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer;color:#fff}
  .watch-actions .primary{background:#2563eb}
  .watch-actions .ghost{background:#334155}
</style>
</head>
<body>
<main>
  <header>
    <a href="/" class="back">← القنوات</a>
    <div class="head-title">
      <h1 id="title">IPTV</h1>
      <div id="subtitle" class="sub">مشاهدة داخل الشبكة</div>
    </div>
  </header>
  <div id="qualityBar" class="quality-bar" style="display:none"></div>
  <video id="video" controls autoplay playsinline></video>
  <div class="info">
    <div class="hint">اختر الجودة المناسبة. إذا لم تعمل جودة معينة، جرّب جودة أخرى أو حاول مرة أخرى بعد قليل.</div>
    <div id="error" class="error"></div>
  </div>
</main>
<div class="watch-overlay" id="watchOverlay">
  <div class="watch-card">
    <h2>هل ما زلت تشاهد؟</h2>
    <p>سيتم إيقاف التشغيل خلال <strong id="watchCountdown">60</strong> ثانية إذا لم يكن هناك تفاعل.</p>
    <div class="watch-actions">
      <button class="primary" id="stillWatchingBtn">نعم، أتابع</button>
      <button class="ghost" id="stopWatchingBtn">إيقاف الآن</button>
    </div>
  </div>
</div>
<script src="/hls.min.js"></script>
<script>
const params = new URLSearchParams(location.search);
const initialId = params.get('id') || '';
const name = params.get('name') || 'IPTV';
const queryQualities = (params.get('qualities') || '').split(',').map(s => s.trim()).filter(Boolean);
const video = document.getElementById('video');
const errorBox = document.getElementById('error');
const qualityBar = document.getElementById('qualityBar');
const watchOverlay = document.getElementById('watchOverlay');
const watchCountdown = document.getElementById('watchCountdown');
document.getElementById('title').textContent = name;
document.title = name + ' - IPTV';
let currentId = initialId;
let hls = null;
let qualitySet = queryQualities.length ? queryQualities.map((id, idx) => ({ id, label: idx === 0 ? 'الأقل' : 'جودة ' + (idx + 1), name })) : [];

function showError(message) {
  if (message) console.warn('[WIVA IPTV]', message);
  errorBox.style.display = 'block';
  errorBox.textContent = friendlyError(message);
}

function clearError() {
  errorBox.style.display = 'none';
  errorBox.textContent = '';
}

function friendlyError(message) {
  const text = String(message || '');
  if (/no playable|no broadcast|empty|no content|nothing playable|لا يوجد/i.test(text)) {
    return 'القناة غير متاحة حالياً. جرّب جودة أخرى أو حاول مرة أخرى لاحقاً.';
  }
  if (/403|rejected|geo-blocked|token|subscription/i.test(text)) {
    return 'لا يمكن تشغيل هذه الجودة حالياً. جرّب جودة أخرى أو حاول لاحقاً.';
  }
  if (/404|not found|gone|expired/i.test(text)) {
    return 'هذه الجودة غير متاحة حالياً.';
  }
  if (/429|limit/i.test(text)) {
    return 'تم إيقاف هذه القناة مؤقتاً.';
  }
  if (/503|server failed|unavailable/i.test(text)) {
    return 'البث غير متاح حالياً. حاول مرة أخرى بعد قليل.';
  }
  return 'تعذر تشغيل القناة. جرّب جودة أخرى أو حاول مرة أخرى لاحقاً.';
}

async function readProxyError(url) {
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 4000);
    const r = await fetch(url, { cache:'no-store', headers:{ Range:'bytes=0-0' }, signal:controller.signal });
    clearTimeout(timer);
    const header = r.headers.get('x-manara-error');
    if (header) return decodeURIComponent(header);
    if (!r.ok) return await r.text() || ('HTTP ' + r.status);
  } catch {}
  return '';
}

async function loadChannelMeta() {
  try {
    const r = await fetch('/api/channels', { cache:'no-store' });
    const data = await r.json();
    const channels = data.channels || [];
    const found = channels.find(c => c.id === initialId || (Array.isArray(c.qualities) && c.qualities.some(q => q.id === initialId)));
    if (!found) return;
    document.getElementById('title').textContent = found.name || name;
    document.getElementById('subtitle').textContent = found.description || 'مشاهدة عند الطلب';
    document.title = (found.name || name) + ' - IPTV';
    qualitySet = Array.isArray(found.qualities) && found.qualities.length
      ? found.qualities.map(q => ({ id:q.id, label:q.label || 'AUTO', name:q.name || found.name }))
      : [{ id:found.id, label:found.quality || 'AUTO', name:found.name }];
    currentId = found.id || initialId;
  } catch {}
}

function renderQualities() {
  if (!qualitySet.length) {
    qualityBar.style.display = 'none';
    return;
  }
  qualityBar.style.display = qualitySet.length > 1 ? 'flex' : 'none';
  qualityBar.innerHTML = qualitySet.map(q => '<button type="button" data-q="' + escapeHtml(q.id) + '" class="' + (q.id === currentId ? 'active' : '') + '">' + escapeHtml(q.label || 'AUTO') + '</button>').join('');
  qualityBar.querySelectorAll('[data-q]').forEach(btn => {
    btn.onclick = () => loadStream(btn.dataset.q);
  });
}

function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function destroyHls() {
  try { if (hls && typeof hls.destroy === 'function') hls.destroy(); } catch {}
  hls = null;
  window.hls = null;
}

function loadStream(id) {
  currentId = id;
  clearError();
  renderQualities();
  const streamUrl = '/iptv/' + encodeURIComponent(currentId);
  try { video.pause(); } catch {}
  destroyHls();
  video.removeAttribute('src');
  try { video.load(); } catch {}
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({ lowLatencyMode:true, manifestLoadingTimeOut:15000, levelLoadingTimeOut:15000, fragLoadingTimeOut:20000 });
    window.hls = hls;
    hls.attachMedia(video);
    hls.on(Hls.Events.MEDIA_ATTACHED, () => hls.loadSource(streamUrl));
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
    hls.on(Hls.Events.ERROR, async (_event, data) => {
      if (!data.fatal) return;
      const failedUrl = data?.context?.url || data?.frag?.url || streamUrl;
      const proxyMessage = await readProxyError(failedUrl);
      showError(proxyMessage || 'تعذر فتح القناة.');
      if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
        try { hls.recoverMediaError(); } catch {}
      }
    });
  } else {
    video.src = streamUrl;
    video.onerror = async () => showError(await readProxyError(streamUrl) || 'تعذر فتح القناة على هذا الجهاز.');
    video.play().catch(() => {});
  }
}

(async () => {
await loadChannelMeta();
if (!currentId) {
  showError('لم يتم تحديد قناة IPTV.');
} else {
  loadStream(currentId);
}
})();

let idleTimer = null;
let countdownTimer = null;
let countdown = 60;
const idleMs = 20 * 60 * 1000;

function stopStreamForThisViewer() {
  try { video.pause(); } catch {}
  try {
    destroyHls();
  } catch {}
  video.removeAttribute('src');
  try { video.load(); } catch {}
  watchOverlay.style.display = 'none';
  showError('توقف التشغيل بسبب عدم وجود تفاعل. اختر القناة مرة أخرى للمتابعة.');
}

function hideStillWatching() {
  watchOverlay.style.display = 'none';
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = null;
  countdown = 60;
  watchCountdown.textContent = countdown;
  resetIdleTimer();
}

function showStillWatching() {
  if (video.paused || video.ended) return resetIdleTimer();
  watchOverlay.style.display = 'flex';
  countdown = 60;
  watchCountdown.textContent = countdown;
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(() => {
    countdown -= 1;
    watchCountdown.textContent = countdown;
    if (countdown <= 0) {
      clearInterval(countdownTimer);
      countdownTimer = null;
      stopStreamForThisViewer();
    }
  }, 1000);
}

function resetIdleTimer() {
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(showStillWatching, idleMs);
}

['mousemove','mousedown','keydown','touchstart','play','seeked','volumechange'].forEach((eventName) => {
  window.addEventListener(eventName, () => {
    if (watchOverlay.style.display === 'flex' && eventName !== 'mousemove') hideStillWatching();
    else resetIdleTimer();
  }, { passive: true });
});
document.getElementById('stillWatchingBtn').addEventListener('click', hideStillWatching);
document.getElementById('stopWatchingBtn').addEventListener('click', stopStreamForThisViewer);
resetIdleTimer();
</script>
</body>
</html>
