<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>IPTV</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#070b1e;color:#eef2ff}
  body{display:grid;place-items:center;padding:18px;background:radial-gradient(900px 480px at 80% -10%,rgba(37,99,235,.25),transparent 60%),#070b1e}
  main{width:min(1080px,100%);border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);border-radius:12px;overflow:hidden}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
  h1{font-size:16px;font-weight:800}
  a{color:#bfdbfe;text-decoration:none;font-size:13px}
  video{display:block;width:100%;max-height:72vh;background:#000}
  .info{padding:14px 16px;font-size:13px;line-height:1.7;color:#cbd5e1}
  .error{margin-top:8px;padding:12px;border:1px solid rgba(248,113,113,.4);background:rgba(127,29,29,.22);border-radius:8px;color:#fecaca;display:none;text-align:right}
  .watch-overlay{position:fixed;inset:0;background:rgba(3,7,18,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
  .watch-card{max-width:420px;width:100%;background:#101936;border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:18px;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.35)}
  .watch-card h2{font-size:20px;margin-bottom:8px}
  .watch-card p{color:#cbd5e1;line-height:1.7;margin-bottom:14px}
  .watch-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .watch-actions button{border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer;color:#fff}
  .watch-actions .primary{background:#2563eb}
  .watch-actions .ghost{background:#334155}
  code{direction:ltr;unicode-bidi:bidi-override;word-break:break-all;color:#bfdbfe}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">IPTV</h1>
    <a href="/">العودة للقنوات</a>
  </header>
  <video id="video" controls autoplay playsinline></video>
  <div class="info">
    يعمل هذا البث عبر خادم Manara المحلي. يتم سحب مصدر IPTV عند الطلب فقط.
    <div id="url"></div>
    <div id="error" class="error"></div>
  </div>
</main>
<div class="watch-overlay" id="watchOverlay">
  <div class="watch-card">
    <h2>هل ما زلت تشاهد؟</h2>
    <p>سيتم إيقاف البث لهذا الجهاز خلال <strong id="watchCountdown">60</strong> ثانية لتقليل استهلاك الإنترنت.</p>
    <div class="watch-actions">
      <button class="primary" id="stillWatchingBtn">نعم، أتابع</button>
      <button class="ghost" id="stopWatchingBtn">إيقاف الآن</button>
    </div>
  </div>
</div>
<script src="/hls.min.js"></script>
<script>
const params = new URLSearchParams(location.search);
const id = params.get('id') || '';
const name = params.get('name') || 'IPTV';
const streamUrl = '/iptv/' + encodeURIComponent(id);
const video = document.getElementById('video');
const errorBox = document.getElementById('error');
const watchOverlay = document.getElementById('watchOverlay');
const watchCountdown = document.getElementById('watchCountdown');
document.getElementById('title').textContent = name;
document.title = name + ' - IPTV';
document.getElementById('url').innerHTML = '<code>' + location.origin + streamUrl + '</code>';

function showError(message) {
  errorBox.style.display = 'block';
  errorBox.textContent = message || 'تعذر تشغيل IPTV.';
}

async function readProxyError(url) {
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 4000);
    const r = await fetch(url, { cache:'no-store', headers:{ Range:'bytes=0-0' }, signal:controller.signal });
    clearTimeout(timer);
    const header = r.headers.get('x-manara-error');
    if (header) return decodeURIComponent(header);
    if (!r.ok) return await r.text() || ('HTTP ' + r.status);
  } catch {}
  return '';
}

if (!id) {
  showError('لم يتم تحديد قناة IPTV.');
} else if (window.Hls && Hls.isSupported()) {
  const hls = new Hls({ lowLatencyMode:true, manifestLoadingTimeOut:15000, levelLoadingTimeOut:15000, fragLoadingTimeOut:20000 });
  window.hls = hls;
  hls.attachMedia(video);
  hls.on(Hls.Events.MEDIA_ATTACHED, () => hls.loadSource(streamUrl));
  hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
  hls.on(Hls.Events.ERROR, async (_event, data) => {
    if (!data.fatal) return;
    const failedUrl = data?.context?.url || data?.frag?.url || streamUrl;
    const proxyMessage = await readProxyError(failedUrl);
    showError(proxyMessage || 'تعذر تشغيل IPTV. المصدر قد يكون متوقفاً أو غير مدعوم على هذا الجهاز.');
    if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
      try { hls.recoverMediaError(); } catch {}
    }
  });
} else {
  video.src = streamUrl;
  video.onerror = async () => showError(await readProxyError(streamUrl) || 'صيغة IPTV غير مدعومة على هذا المتصفح.');
  video.play().catch(() => {});
}

let idleTimer = null;
let countdownTimer = null;
let countdown = 60;
const idleMs = 20 * 60 * 1000;

function stopStreamForThisViewer() {
  try { video.pause(); } catch {}
  try {
    if (window.hls && typeof window.hls.destroy === 'function') window.hls.destroy();
  } catch {}
  video.removeAttribute('src');
  try { video.load(); } catch {}
  watchOverlay.style.display = 'none';
  showError('تم إيقاف البث لهذا الجهاز بسبب عدم وجود تفاعل. اضغط الرجوع واختر القناة مرة أخرى للتشغيل.');
}

function hideStillWatching() {
  watchOverlay.style.display = 'none';
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = null;
  countdown = 60;
  watchCountdown.textContent = countdown;
  resetIdleTimer();
}

function showStillWatching() {
  if (video.paused || video.ended) return resetIdleTimer();
  watchOverlay.style.display = 'flex';
  countdown = 60;
  watchCountdown.textContent = countdown;
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(() => {
    countdown -= 1;
    watchCountdown.textContent = countdown;
    if (countdown <= 0) {
      clearInterval(countdownTimer);
      countdownTimer = null;
      stopStreamForThisViewer();
    }
  }, 1000);
}

function resetIdleTimer() {
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(showStillWatching, idleMs);
}

['mousemove','mousedown','keydown','touchstart','play','seeked','volumechange'].forEach((eventName) => {
  window.addEventListener(eventName, () => {
    if (watchOverlay.style.display === 'flex' && eventName !== 'mousemove') hideStillWatching();
    else resetIdleTimer();
  }, { passive: true });
});
document.getElementById('stillWatchingBtn').addEventListener('click', hideStillWatching);
document.getElementById('stopWatchingBtn').addEventListener('click', stopStreamForThisViewer);
resetIdleTimer();
</script>
</body>
</html>
