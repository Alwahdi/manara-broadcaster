<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>مشاهدة البث</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
  :root{--font-arabic:"Cairo","Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;--accent:#F8C51C;--accent2:#FFD84D;--bg:#050507;--panel:#0B0D12;--line:rgba(255,255,255,.10);--muted:#A1A7B3;--live:#FF3B30}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:var(--font-arabic);background:#000;color:#fff;overflow:hidden;direction:rtl;text-align:right}
  body{display:flex;flex-direction:column}
  header{padding:14px 18px;display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,rgba(5,5,7,.82),rgba(5,5,7,.16));position:absolute;top:0;left:0;right:0;z-index:5;transition:.3s;backdrop-filter:blur(14px)}
  header.hidden{transform:translateY(-100%);opacity:0}
  .back{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:8px 14px;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:16px;color:#fff;text-decoration:none;font-weight:900;font-size:13px}
  .back:hover{background:rgba(255,255,255,.14)}
  .ch-name{font-size:15px;font-weight:950;letter-spacing:0}
  .ch-desc{font-size:11px;color:var(--muted);font-weight:700}
  .status-pill{margin-right:auto;display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-size:11px;font-weight:900;background:rgba(255,255,255,.08);border:1px solid var(--line)}
  .status-pill .dot{width:8px;height:8px;border-radius:50%;background:#6b7280}
  .status-pill.live .dot{background:var(--live);box-shadow:0 0 10px var(--live);animation:pulse 1.4s infinite}
  @keyframes pulse{50%{opacity:.4}}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
  video{width:100%;height:100%;object-fit:contain;background:#000}
  .overlay{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,rgba(248,197,28,.16),transparent 34%),linear-gradient(180deg,rgba(5,5,7,.96),#000);padding:30px;text-align:center}
  .overlay .panel{max-width:460px;padding:34px 28px;background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .overlay h2{font-size:24px;font-weight:950;margin-bottom:8px}
  .overlay p{color:var(--muted);font-size:13px;line-height:1.8}
  .spinner{width:46px;height:46px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header id="hdr">
  <a href="/" class="back">← القنوات</a>
  <div>
    <div class="ch-name" id="chName">—</div>
    <div class="ch-desc" id="chDesc"></div>
  </div>
  <span class="status-pill" id="statusPill"><span class="dot"></span><span id="statusText">جاري الاتصال…</span></span>
</header>
<main class="stage" id="stage">
  <div class="overlay" id="overlay">
    <div class="panel"><div class="spinner"></div><h2>جاري فتح القناة…</h2><p>لحظات فقط.</p></div>
  </div>
</main>
<script>
(async () => {
  const qs = new URLSearchParams(location.search);
  const channelId = qs.get('ch');
  if (!channelId) { location.href='/'; return; }

  // Load brand + channel meta
  try {
    const r = await fetch('/api/channels');
    const d = await r.json();
    const brand = d.brand || {};
    document.documentElement.style.setProperty('--accent', brand.accent || '#F8C51C');
    document.documentElement.style.setProperty('--accent2', brand.accent2 || '#FFD84D');
    const ch = (d.channels||[]).find(c => c.id === channelId);
    if (ch) { document.getElementById('chName').textContent = ch.name; document.getElementById('chDesc').textContent = ch.description || 'بث ويفا المحلي'; document.title = ch.name + ' — ' + (brand.brandName||'ويفا'); }
  } catch {}

  const statusPill = document.getElementById('statusPill');
  const statusText = document.getElementById('statusText');
  const overlay = document.getElementById('overlay');
  const stage = document.getElementById('stage');
  const hdr = document.getElementById('hdr');
  let videoEl = null, pc = null;

  function setStatus(t, live=false){ statusText.textContent=t; statusPill.classList.toggle('live', live); }
  function showOverlay(title, body) {
    overlay.style.display = 'grid';
    overlay.innerHTML = `<div class="panel"><h2>${title}</h2><p>${body}</p><p style="margin-top:12px;color:#F8C51C">يمكنك الرجوع واختيار قناة أخرى.</p></div>`;
  }
  function showSpinner(title, body) {
    overlay.style.display = 'grid';
    overlay.innerHTML = `<div class="panel"><div class="spinner"></div><h2>${title}</h2><p>${body}</p></div>`;
  }
  function ensureVideo() {
    if (videoEl) return videoEl;
    overlay.style.display = 'none';
    videoEl = document.createElement('video');
    videoEl.autoplay = true; videoEl.playsInline = true; videoEl.controls = true;
    stage.appendChild(videoEl);
    return videoEl;
  }

  // Auto-hide header on inactivity
  let hideTimer; const resetHide=()=>{hdr.classList.remove('hidden');clearTimeout(hideTimer);hideTimer=setTimeout(()=>hdr.classList.add('hidden'),3500)};
  document.addEventListener('mousemove',resetHide);document.addEventListener('touchstart',resetHide);resetHide();

  const wsUrl = (location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';
  let ws;
  function connect() {
    ws = new WebSocket(wsUrl);
    ws.onopen = () => { setStatus('جاهز'); ws.send(JSON.stringify({ type:'register-viewer', channelId })); };
    ws.onclose = () => { setStatus('إعادة الاتصال'); setTimeout(connect, 2000); };
    ws.onerror = () => { setStatus('إعادة المحاولة'); };
    ws.onmessage = async (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'viewer-id') {
        if (!msg.hasBroadcaster) showOverlay('القناة غير متاحة حاليًا', 'قد يكون المصدر متوقفًا أو لم يبدأ البث بعد.');
      } else if (msg.type === 'broadcaster-online') {
        showSpinner('جاري فتح القناة', 'لحظات فقط.');
      } else if (msg.type === 'broadcaster-left') {
        if (pc) { pc.close(); pc=null; }
        if (videoEl) { videoEl.remove(); videoEl=null; }
        showOverlay('توقف البث مؤقتًا', 'سنحاول إعادة الاتصال تلقائيًا. إذا استمر التوقف، اختر قناة أخرى أو تواصل مع المدير.');
        setStatus('متوقف');
      } else if (msg.type === 'offer') {
        pc = new RTCPeerConnection({ iceServers: [] });
        pc.ontrack = (ev) => { const v = ensureVideo(); v.srcObject = ev.streams[0]; setStatus('يبث الآن', true); };
        pc.onicecandidate = (ev) => { if (ev.candidate) ws.send(JSON.stringify({ type:'ice', candidate: ev.candidate })); };
        await pc.setRemoteDescription({ type:'offer', sdp: msg.sdp });
        const ans = await pc.createAnswer();
        await pc.setLocalDescription(ans);
        ws.send(JSON.stringify({ type:'answer', sdp: ans.sdp }));
      } else if (msg.type === 'ice' && pc) {
        try { await pc.addIceCandidate(msg.candidate); } catch {}
      }
    };
  }
  connect();
})();
</script>
</body>
</html>
