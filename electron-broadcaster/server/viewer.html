<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>Manara</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
  :root { --accent:#2563eb; --accent2:#14b8a6; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#070b1e;color:#e8eaf6;-webkit-font-smoothing:antialiased}
  body{background:linear-gradient(180deg,#0f172a 0%,#070b1e 55%,#050816 100%);min-height:100dvh}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 18px 80px}
  header.hero{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:8px;background:rgba(15,23,42,.72);backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(255,255,255,.1)}
  .logo{width:48px;height:48px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 18px 36px -24px var(--accent);display:grid;place-items:center;color:#fff;font-weight:900;font-size:20px;letter-spacing:0;overflow:hidden}
  .logo img{width:100%;height:100%;object-fit:cover}
  .brand h1{font-size:18px;font-weight:900;letter-spacing:-.3px}
  .brand p{font-size:12px;opacity:.65;font-weight:600;margin-top:2px}
  .live-pill{margin-right:auto;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(20,184,166,.12);border:1px solid rgba(20,184,166,.32);color:#ccfbf1;border-radius:8px;font-size:12px;font-weight:800}
  .live-pill .dot{width:8px;height:8px;border-radius:50%;background:#14b8a6;box-shadow:0 0 10px #14b8a6;animation:pulse 1.4s infinite}
  @keyframes pulse{50%{opacity:.4}}

  .title-row{margin:28px 4px 14px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .title-row h2{font-size:24px;font-weight:900;letter-spacing:-.4px}
  .title-row span{font-size:12px;opacity:.6;font-weight:700}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .card{position:relative;border-radius:8px;overflow:hidden;background:rgba(15,23,42,.72);backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(255,255,255,.1);transition:.18s;cursor:pointer;display:flex;flex-direction:column;text-decoration:none;color:inherit}
  .card:hover{transform:translateY(-3px);border-color:rgba(37,99,235,.62);box-shadow:0 24px 60px -20px rgba(37,99,235,.38)}
  .thumb{aspect-ratio:16/9;background:linear-gradient(135deg,#111d38,#0c3336);display:grid;place-items:center;font-size:54px;position:relative;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb .initial{width:72px;height:72px;border-radius:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;font-size:30px;font-weight:900;color:#fff}
  .thumb .live-tag{position:absolute;top:10px;right:10px;background:#dc2626;color:#fff;font-size:10px;font-weight:900;letter-spacing:.5px;padding:4px 8px;border-radius:6px;display:flex;align-items:center;gap:5px}
  .thumb .live-tag .dot{width:6px;height:6px;background:#fff;border-radius:50%;animation:pulse 1.4s infinite}
  .thumb .off-tag{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-weight:800;padding:4px 8px;border-radius:6px}
  .thumb .v-tag{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:800;padding:4px 8px;border-radius:6px;display:flex;align-items:center;gap:4px}
  .body{padding:14px 14px 16px}
  .body h3{font-size:16px;font-weight:900;letter-spacing:-.2px;margin-bottom:4px}
  .body p{font-size:12px;opacity:.65;line-height:1.6;font-weight:500;min-height:1.2em}
  .qualities{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .quality{border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.08);border-radius:6px;padding:3px 8px;font-size:10px;font-weight:900;color:#dbeafe}

  .empty{margin-top:40px;text-align:center;padding:50px 20px;background:rgba(15,23,42,.62);border:1px dashed rgba(255,255,255,.14);border-radius:8px}
  .empty .big{font-size:60px;margin-bottom:10px;opacity:.7}
  .empty h2{font-size:18px;margin-bottom:6px}
  .empty p{opacity:.65;font-size:13px;line-height:1.7}

  footer{margin-top:30px;text-align:center;font-size:11px;opacity:.5;font-weight:700;letter-spacing:.4px}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="logo" id="logoBox">T</div>
    <div class="brand">
      <h1 id="brandName">TeraNet</h1>
      <p id="brandTagline">خدمة مشاهدة داخل الشبكة</p>
    </div>
    <span class="live-pill"><span class="dot"></span> جاهز للمشاهدة</span>
  </header>

  <div class="title-row">
    <h2>اختر ما تريد مشاهدته</h2>
    <span id="count">— قناة</span>
  </div>

  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none">
    <div class="big">—</div>
    <h2>لا توجد قنوات متاحة الآن</h2>
    <p>يرجى المحاولة لاحقاً أو التواصل مع المسؤول عن الشبكة.</p>
  </div>

  <footer id="footerName">Manara</footer>
</div>

<script>
async function load() {
  try {
    const r = await fetch('/api/channels', { cache: 'no-store' });
    const data = await r.json();
    const brand = data.brand || {};
    document.documentElement.style.setProperty('--accent', brand.accent || '#3b82f6');
    document.documentElement.style.setProperty('--accent2', brand.accent2 || '#8b5cf6');
    document.getElementById('brandName').textContent = brand.brandName || 'TeraNet';
    document.getElementById('brandTagline').textContent = brand.brandTagline || 'خدمة مشاهدة داخل الشبكة';
    document.getElementById('logoBox').innerHTML = brand.logoUrl ? '<img alt="" src="' + escapeAttr(brand.logoUrl) + '">' : escapeHtml((brand.brandName || 'M').trim().charAt(0).toUpperCase());
    document.title = (brand.brandName || 'Manara') + ' — المشاهدة';
    document.getElementById('footerName').textContent = (brand.brandName || 'Manara');

    const chs = data.channels || [];
    document.getElementById('count').textContent = chs.length + ' قناة متاحة';
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    grid.innerHTML = '';
    if (!chs.length) { empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    for (const c of chs) {
      const a = document.createElement('a');
      a.className = 'card';
      const isIptv = c.type === 'iptv';
      const qualities = Array.isArray(c.qualities) ? c.qualities : [];
      const qualityIds = qualities.map(q => q.id).filter(Boolean);
      a.href = isIptv
        ? '/iptv-player?id=' + encodeURIComponent(c.id) + '&name=' + encodeURIComponent(c.name || 'IPTV') + '&qualities=' + encodeURIComponent(qualityIds.join(','))
        : '/watch?ch=' + encodeURIComponent(c.id);
      const liveTag = isIptv
        ? '<span class="live-tag"><span class="dot"></span>مباشر</span>'
        : (c.live ? '<span class="live-tag"><span class="dot"></span>مباشر</span>' : '<span class="off-tag">غير متاحة الآن</span>');
      const vTag = c.live && !isIptv ? '<span class="v-tag">' + (c.viewers||0) + ' مشاهد</span>' : (isIptv ? '<span class="v-tag">' + escapeHtml(c.quality || 'عند الطلب') + '</span>' : '');
      const qualityHtml = isIptv && qualities.length > 1
        ? '<div class="qualities">' + qualities.map(q => '<span class="quality">' + escapeHtml(q.label || 'AUTO') + '</span>').join('') + '</div>'
        : '';
      const logo = c.logo || (qualities.find(q => q.logo)?.logo) || '';
      const thumb = logo ? '<img alt="" src="' + escapeAttr(logo) + '">' : '<span class="initial">' + escapeHtml((c.name || 'M').trim().charAt(0).toUpperCase()) + '</span>';
      a.innerHTML = `
        <div class="thumb">${thumb}${liveTag}${vTag}</div>
        <div class="body"><h3>${escapeHtml(c.name)}</h3><p>${escapeHtml(c.description || '')}</p>${qualityHtml}</div>
      `;
      grid.appendChild(a);
    }
  } catch (e) { console.error(e); }
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escapeAttr(s){return escapeHtml(s).replace(/`/g,'&#96;')}
load();
setInterval(load, 3000);
</script>
</body>
</html>
